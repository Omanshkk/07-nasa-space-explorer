<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NASA Space Explorer</title>
  <link href="style.css?v=20260725-1" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button type="button" id="loadImagesButton">Get Space Images</button>
    </div>

    <section class="fact-section" aria-label="Space fact">
      <p id="spaceFact">Did you know? Loading a fun space fact…</p>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <button type="button" class="modal-close-btn" id="closeModalButton" aria-label="Close modal">×</button>
      <div id="modalMedia"></div>
      <div class="modal-details">
        <p class="modal-date" id="modalDate"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation"></p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js?v=20260725-1"></script>
  <script src="js/script.js?v=20260725-1"></script>
</body>
</html>
